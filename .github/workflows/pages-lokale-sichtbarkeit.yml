name: Deploy Lokale Sichtbarkeit to GitHub Pages

on:
  push:
    branches: ["claude/local-visibility-service-ppQnN"]
    paths: ["lokale-sichtbarkeit/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/local-visibility-service-ppQnN
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './lokale-sichtbarkeit'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
